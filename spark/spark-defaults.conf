# Default system properties included when running spark-submit.
# This is useful for setting default environmental settings.

# Example:
spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

#  REST Catalog (Iceberg REST)
spark.sql.catalog.demo                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.demo.type            rest
spark.sql.catalog.demo.uri             http://rest:8181
spark.sql.catalog.demo.io-impl         org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.demo.warehouse       s3://warehouse/wh/
spark.sql.catalog.demo.s3.endpoint     http://minio:9000

#  REST Catalog (Iceberg) — default (used by pipeline)
spark.sql.catalog.default              org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.default.type         rest
spark.sql.catalog.default.uri          http://rest:8181
spark.sql.catalog.default.io-impl      org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.default.warehouse    s3://warehouse/
spark.sql.catalog.default.s3.endpoint  http://minio:9000
spark.sql.catalog.default.default-namespace silver

spark.sql.defaultCatalog               default
spark.eventLog.enabled                 true
spark.eventLog.dir                     /home/iceberg/spark-events
spark.history.fs.logDirectory          /home/iceberg/spark-events
spark.sql.catalogImplementation        in-memory

# S3A Hadoop filesystem - needed when Spark itself (not Iceberg) resolves s3a:// or s3:// paths
spark.hadoop.fs.s3.impl                 org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.impl                org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.access.key          admin
spark.hadoop.fs.s3a.secret.key          password
spark.hadoop.fs.s3a.endpoint            http://minio:9000
spark.hadoop.fs.s3a.path.style.access   true
spark.hadoop.fs.s3a.connection.ssl.enabled false

# Spark Connect server (Spark 3.4+)
spark.connect.port                     15002
spark.connect.bind                     0.0.0.0

# External packages (pyspark for reading excel file)
spark.jars.packages                    com.crealytics:spark-excel_2.12:3.5.1_0.20.4
