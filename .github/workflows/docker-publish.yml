name: Docker Publish

# Triggers
# ─────────────────────────────────────────────────────────────────────────────
# • push to main          → builds & pushes with the `latest` tag
# • push of a semver tag  → builds & pushes with version tags (e.g. 1.2, 1.2.3)
# • pull_request to main  → builds only (no push) for validation
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

jobs:
  build-push:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: spark-iceberg
            context: .                   # spark/Dockerfile uses COPY spark/… paths
            file: spark/Dockerfile
            image: spark-iceberg

          - name: superset-iceberg
            context: superset/           # superset/Dockerfile uses bare COPY paths
            file: superset/Dockerfile
            image: superset-iceberg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needed for multi-platform (arm64) emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Derive image tags automatically:
      #   push to main         → :latest
      #   push tag v1.2.3      → :1.2.3, :1.2, :latest
      #   pull_request         → :pr-<number> (not pushed)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache scoped per image so the two jobs don't collide
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
