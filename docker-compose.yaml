---
x-airflow-common: &airflow-common
  build: ./airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@shared-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # AIRFLOW__CORE__LOAD_EXAMPLES: 'true'
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    AIRFLOW_CONFIG: "/opt/airflow/config/airflow.cfg"
    AIRFLOW_CONN_MINIO_S3: "aws://admin:password@?endpoint_url=http%3A%2F%2Fminio%3A9000"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    iceberg_net:
  depends_on: &airflow-common-depends-on
    shared-postgres:
      condition: service_healthy

services:
  shared-postgres:
    image: postgres:15
    container_name: lppm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - shared-postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: always
    networks:
      iceberg_net:
    # deploy:
    #   resources:
    #     limits:
    #       memory: 384M

  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: lppm-spark-iceberg
    build:
      context: .
      dockerfile: spark/Dockerfile
    networks:
      iceberg_net:
    depends_on:
      - rest
      - minio
    volumes:
      - ./spark/notebooks/:/home/iceberg/notebooks
      - ./pipeline/:/home/iceberg/pipeline
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    ports:
      - 8888:8888
      - 8080:8080
      - 10000:10000
      - 10001:10001
    # deploy:
    #   resources:
    #     limits:
    #       memory: 768M

  rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: lppm-iceberg-rest
    networks:
      iceberg_net:
    ports:
      - 8181:8181
    # Run as root: the fixture image runs as uid 1000 by default,
    # but the Docker volume /var/lib/iceberg is owned by root and
    # SQLite needs to create -journal/-wal files in that directory.
    user: "0:0"
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      # Persist the JDBC catalog (SQLite) across restarts instead of /tmp
      - CATALOG_URI=jdbc:sqlite:/var/lib/iceberg/rest_catalog.db
      - CATALOG_CATALOG__IMPL=org.apache.iceberg.jdbc.JdbcCatalog
      - CATALOG_JDBC__STRICT__MODE=true
    volumes:
      - iceberg-rest-catalog:/var/lib/iceberg
    # deploy:
    #   resources:
    #     limits:
    #       memory: 128M

  minio:
    image: minio/minio
    container_name: lppm-minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
    volumes:
      - ./minio_data:/data
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - 9001:9001
      - 9000:9000
    command: ["server", "/data", "--console-address", ":9001"]
    # deploy:
    #   resources:
    #     limits:
    #       memory: 384M

  mc:
    depends_on:
      - minio
    image: minio/mc
    container_name: lppm-mc
    networks:
      iceberg_net:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    volumes:
      - ./minio/mc-init.sh:/mc-init.sh
      - ./minio/mc-delete-all.sh:/mc-delete-all.sh
      - ./pipeline:/home/iceberg/pipeline
      - ./notebooks:/home/iceberg/notebooks
    entrypoint: ["/bin/sh", "/mc-init.sh"]

  superset-redis:
    image: redis:7.2-bookworm
    container_name: lppm-superset-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
      start_period: 5s
    networks:
      iceberg_net:
    # deploy:
    #   resources:
    #     limits:
    #       memory: 128M

  superset-init:
    build: superset/
    container_name: lppm-superset-init
    depends_on:
      shared-postgres:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    volumes:
      - ./superset/superset_config_docker.py:/app/superset_config_docker.py
    environment:
      - SUPERSET_SECRET_KEY=YOUR_OWN_RANDOM_SECRET_KEY_CHANGE_ME
      - SUPERSET_CONFIG_PATH=/app/superset_config_docker.py
      - SUPERSET_DB_HOST=shared-postgres
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://superset:superset@shared-postgres:5432/superset
    command: ["/bin/sh", "/app/superset-init.sh"]
    networks:
      iceberg_net:

  superset:
    build: superset/
    container_name: lppm-superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
    volumes:
      - ./superset/superset_config_docker.py:/app/superset_config_docker.py
    environment:
      - SUPERSET_SECRET_KEY=YOUR_OWN_RANDOM_SECRET_KEY_CHANGE_ME
      - SUPERSET_CONFIG_PATH=/app/superset_config_docker.py
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://superset:superset@shared-postgres:5432/superset
    ports:
      - 8088:8088
    networks:
      iceberg_net:
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

  trino:
    container_name: lppm-trino
    image: trinodb/trino:426
    volumes:
      - ./trino/etc:/etc/trino
    ports:
      - "8085:8085"
    depends_on:
      - rest
      - minio
    networks:
      iceberg_net:
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

  airflow-webserver:
    <<: *airflow-common
    container_name: lppm-airflow-webserver
    command: webserver
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    # deploy:
    #   resources:
    #     limits:
    #       memory: 384M

  airflow-scheduler:
    <<: *airflow-common
    container_name: lppm-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    # deploy:
    #   resources:
    #     limits:
    #       memory: 384M

  airflow-init:
    <<: *airflow-common
    container_name: lppm-airflow-init
    entrypoint: ["/bin/bash", "/opt/airflow/airflow-init.sh"]
    volumes:
      - ./airflow:/opt/airflow
    environment:
      <<: *airflow-common-env
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    container_name: lppm-airflow-cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

networks:
  iceberg_net:

volumes:
  shared-postgres-data:
  airflow-logs:
  iceberg-rest-catalog:
