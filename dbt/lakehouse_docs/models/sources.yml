version: 2

sources:
  - name: bronze
    database: default
    schema: bronze
    description: Raw data located in Minio S3
    tables:
      - name: penelitian
        description: "{{ doc('bronze_penelitian') }}"
        columns: &raw_hibah_columns
          - name: judul_proposal
            description: Judul Proposal
          - name: ketua_peneliti
            description: Ketua Peneliti
          - name: jenis
            description: Jenis hibah (penelitian, pengabdian, buku keilmuan)
          - name: status
            description: Status hibah (diterima, ditolak, diusulkan)
          - name: skema
            description: Skema (terlampir)
          - name: scope
            description: Scope (variatif)
          - name: sdgs
            description: SDGs (terlampir)
          - name: prodi
            description: Program studi
          - name: anggota_dosen
            description: Anggota dosen (nama dan/atau NIP)
          - name: anggota_mahasiswa
            description: Anggota mahasiswa (nama dan/atau NIM)
          - name: advisor
            description: Advisor name
          - name: usulan_biaya
            description: Biaya ajuan proposal
          - name: status_proposal
            description: Proposal status (sudah upload, belum upload)
      - name: pengabdian
        columns: *raw_hibah_columns
        description: "{{ doc('bronze_pengabdian') }}"
      - name: buku_keilmuan
        columns: *raw_hibah_columns
        description: "{{ doc('bronze_buku_keilmuan') }}"
      - name: sitasi
        columns: *raw_hibah_columns
        description: "{{ doc('bronze_sitasi') }}"

  - name: silver
    database: default
    schema: silver
    description: Cleaned source tables produced by the ingestion and transformation pipeline.
    tables:
      - name: penelitian
        description: "{{ doc('silver_penelitian') }}"
        columns: &hibah_columns
          - name: id
            description: Surrogate identifier (e.g. PENELITIAN-1)
          - name: judul_proposal
            description: Judul proposal penelitian
          - name: ketua_peneliti
            description: Nama ketua peneliti (sudah distandarisasi)
          - name: jenis
            description: Jenis hibah (penelitian, pengabdian, buku_keilmuan)
          - name: status
            description: Status hibah (diterima, ditolak, diusulkan)
          - name: skema
            description: Nama skema hibah
          - name: scope
            description: Scope penelitian
          - name: sdgs
            description: Kategori SDGs
          - name: usulan_biaya
            description: Biaya yang diusulkan (Rupiah)
          - name: status_proposal
            description: Status upload proposal (Sudah Upload, Belum Upload)
          - name: tahun
            description: Tahun pelaksanaan
          - name: prodi
            description: Program studi ketua peneliti
          - name: fakultas
            description: Fakultas ketua peneliti
          - name: nip_ketua_peneliti
            description: Array NIP ketua peneliti
          - name: nim_anggota_mahasiswa
            description: Array NIM anggota mahasiswa
          - name: nama_anggota_mahasiswa
            description: Array nama anggota mahasiswa
          - name: nip_anggota_dosen
            description: Array NIP anggota dosen
          - name: nama_anggota_dosen
            description: Array nama anggota dosen
          - name: advisor
            description: Nama advisor (jika ada)

      - name: pengabdian
        description: "{{ doc('silver_pengabdian') }}"
        columns: *hibah_columns

      - name: buku_keilmuan
        description: "{{ doc('silver_buku_keilmuan') }}"
        columns: *hibah_columns

      - name: sitasi
        description: "{{ doc('silver_sitasi') }}"
        columns:
          - name: id
            description: Surrogate identifier (e.g. SITASI-1)
          - name: prodi
            description: Program studi dosen
          - name: fakultas
            description: Fakultas dosen
          - name: ketua_peneliti
            description: Nama dosen pemilik publikasi (sudah distandarisasi)
          - name: judul_proposal
            description: Judul proposal terkait publikasi
          - name: sitasi
            description: Jumlah sitasi publikasi
          - name: triwulan
            description: Triwulan pelaporan sitasi (1-4)
          - name: publikasi
            description: Format publikasi lengkap (judul, volume, issue, halaman, tahun)
          - name: doi
            description: DOI publikasi (URL format)
          - name: tanggal_terbit_hari
            description: Hari terbit publikasi
          - name: tanggal_terbit_bulan
            description: Bulan terbit publikasi
          - name: tanggal_terbit_tahun
            description: Tahun terbit publikasi
          - name: tanggal_terbit_timestamp
            description: Timestamp terbit publikasi
          - name: jurnal
            description: Nama jurnal (sudah distandarisasi)
          - name: jurnal_kategori
            description: Kategori jurnal (INTERNASIONAL, NASIONAL, LAINNYA)

      - name: dim_skema
        description: "{{ doc('silver_dim_skema') }}"
        columns:
          - name: skema
            description: Daftar skema terlampir

      - name: dim_sdgs
        description: "{{ doc('silver_dim_sdgs') }}"
        columns:
          - name: sdgs
            description: Daftar sdgs terlampir

  - name: gold
    database: default
    schema: gold
    description: Analytics tables used for reporting and dashboarding (Superset).
    tables:
      - name: dim_dosen
        description: "{{ doc('gold_dim_dosen') }}"
        columns:
          - name: dosen_id
            description: Surrogate key (ROW_NUMBER)
          - name: nip
            description: NIP dosen
          - name: nama
            description: Nama dosen (sudah distandarisasi)

      - name: dim_skema
        description: "{{ doc('gold_dim_skema') }}"
        columns:
          - name: skema_id
            description: Surrogate key (1-25)
          - name: nama_skema
            description: Nama skema hibah
          - name: pendanaan_maks
            description: Pendanaan maksimum (Rupiah), NULL jika tidak terdefinisi

      - name: dim_sdgs
        description: "{{ doc('gold_dim_sdgs') }}"
        columns:
          - name: sdgs_id
            description: Surrogate key (1-21)
          - name: kode_sdgs
            description: Kode/nama SDGs (e.g. 'SDG 1 No Poverty', 'Dasar Fundamental')

      - name: dim_jurnal
        description: "{{ doc('gold_dim_jurnal') }}"
        columns:
          - name: jurnal_id
            description: Surrogate key (ROW_NUMBER)
          - name: nama_jurnal
            description: Nama jurnal (sudah distandarisasi)
          - name: rank_jurnal
            description: Peringkat jurnal (same as nama_jurnal, untuk future ranking)
          - name: kategori_jurnal
            description: Kategori jurnal (INTERNASIONAL, NASIONAL, LAINNYA)

      - name: dim_hibah_proposal
        description: "{{ doc('gold_dim_hibah_proposal') }}"
        columns:
          - name: hibah_proposal_id
            description: Surrogate identifier dari silver (e.g. PENELITIAN-1)
          - name: judul_proposal
            description: Judul proposal hibah
          - name: status_proposal
            description: Status upload proposal (Sudah Upload, Belum Upload)
          - name: jenis_hibah
            description: Jenis hibah (penelitian, pengabdian, buku_keilmuan)

      - name: fact_hibah
        description: "{{ doc('gold_fact_hibah') }}"
        columns:
          - name: hibah_fact_id
            description: Surrogate key (ROW_NUMBER)
          - name: ketua_id
            description: FK ke dim_dosen.dosen_id (dosen ketua peneliti)
          - name: hibah_proposal_id
            description: FK ke dim_hibah_proposal.hibah_proposal_id
          - name: skema_id
            description: FK ke dim_skema.skema_id
          - name: sdgs_id
            description: FK ke dim_sdgs.sdgs_id
          - name: jenis_hibah
            description: Jenis hibah (penelitian, pengabdian, buku_keilmuan)
          - name: tahun
            description: Tahun pelaksanaan
          - name: status_hibah
            description: Status hibah (diterima, ditolak, diusulkan)
          - name: total_anggota_mahasiswa
            description: Jumlah anggota mahasiswa dalam tim
          - name: total_anggota_dosen
            description: Jumlah anggota dosen dalam tim
          - name: usulan_biaya
            description: Total biaya yang diusulkan (Rupiah)

      - name: fact_dosen_hibah
        description: "{{ doc('gold_fact_dosen_hibah') }}"
        columns:
          - name: dosen_hibah_id
            description: Surrogate key (ROW_NUMBER)
          - name: dosen_id
            description: FK ke dim_dosen.dosen_id
          - name: hibah_proposal_id
            description: FK ke dim_hibah_proposal.hibah_proposal_id
          - name: tahun
            description: Tahun pelaksanaan hibah
          - name: role
            description: Peran dosen dalam hibah (ketua, anggota)
          - name: jenis_hibah
            description: Jenis hibah (penelitian, pengabdian, buku_keilmuan)
          - name: status_hibah
            description: Status hibah (diterima, ditolak, diusulkan)
          - name: prodi
            description: Program studi dosen saat proposal
          - name: fakultas
            description: Fakultas dosen saat proposal

      - name: fact_sitasi
        description: "{{ doc('gold_fact_sitasi') }}"
        columns:
          - name: sitasi_id
            description: Surrogate key (ROW_NUMBER)
          - name: dosen_id
            description: FK ke dim_dosen.dosen_id
          - name: jurnal_id
            description: FK ke dim_jurnal.jurnal_id
          - name: total_publikasi
            description: Total publikasi dosen di jurnal tersebut
          - name: total_internasional
            description: Total publikasi internasional dosen di jurnal tersebut
          - name: total_nasional
            description: Total publikasi nasional dosen di jurnal tersebut